<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/modules.js"></script>
  <title>Wofertas · Login</title>
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img src="/imagens/imagemLogo.png" alt="Logo do Wofertas" class="icon-carrinho">
      <a href="/">
        <div class="logo"><span class="w">W</span><span class="rest">ofertas</span></div>
      </a>
    </div>

    <nav class="header-nav">
      <a href="/">Início</a>
      <a href="/mercado-cadastro.html" class="btnLoginPage">Cadastrar mercado</a>
    </nav>
  </header>

  <main class="login-container">
    <div class="login-card">
      <h2>Entrar no painel</h2>

      <p class="page-subtle" style="margin-top:-4px;margin-bottom:24px;line-height:1.6">
        Acesso exclusivo para supermercados cadastrados.
      </p>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" class="login-input" placeholder="seu@email.com">
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" class="login-input" placeholder="Sua senha">
      </div>

      <!-- IMPORTANTE: type="button" pra não dar refresh -->
      <button type="button" class="login-btn" id="login-btn">Entrar</button>

      <div class="back-link">
        <a href="/reset-senha.html">Esqueceu sua senha?</a>
      </div>
    </div>
  </main>

  <script src="/login.js"></script>
</body>
</html>
