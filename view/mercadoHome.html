<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <title>Wofertas · Painel</title>
</head>
<body>
  <header class="header">
    <div class="logo-container">
      <img src="imagens/imagemLogo.png" alt="Logo do Wofertas" class="icon-carrinho">
      <a href="mercadoHome.html">
        <div class="logo"><span class="w">W</span><span class="rest">ofertas</span></div>
      </a>
    </div>
    <nav class="header-nav">
      <a href="mercadoHome.html" class="active">Painel</a>
      <a href="dashboard-analytics.html">📊 Analytics</a>
      <a href="criar-oferta.html">Nova Oferta</a>
      <a href="historico.html">Histórico</a>
      <a href="perfil_mercado.html">Perfil</a>
      <button onclick="logout()" class="btn-sair">Sair</button>
    </nav>
  </header>

  <main class="container-wide">
    <div class="page-head">
      <div>
        <h2 id="saudacao">Carregando...</h2>
        <div id="mercadoInfo" class="page-subtle"></div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-info">
          <div id="statTotal" class="value">0</div>
          <div class="label">Total de ofertas</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-info">
          <div id="statAtivas" class="value">0</div>
          <div class="label">Ofertas ativas</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏳</div>
        <div class="stat-info">
          <div id="statSuspensas" class="value">0</div>
          <div class="label">Suspensas</div>
        </div>
      </div>
    </div>

    <div class="page-head">
      <h3 class="title" style="margin:0">Últimas ofertas</h3>
      <a href="criar-oferta.html" class="btnLoginPage">+ Publicar oferta</a>
    </div>

    <div id="ultimasOfertas" class="ofertas-grid">
      <div class="msg-vazia">Carregando ofertas...</div>
    </div>
  </main>

    <div id="modalImagem" class="modal" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.9); align-items:center; justify-content:center;">
    <img id="modalFoto" style="max-width:90%; max-height:90%; border-radius:8px; box-shadow:0 0 20px rgba(0,0,0,0.5);">
    </div>
  <script src="auth-check.js"></script>
  
  <script src="mercadoHome.js"></script>
</body>
</html>
