<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <title>Wofertas · Nova Oferta</title>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <header class="header">
    <div class="logo-container">
      <img src="imagens/imagemLogo.png" alt="Logo do Wofertas" class="icon-carrinho">
      <a href="mercadoHome.html">
        <div class="logo"><span class="w">W</span><span class="rest">ofertas</span></div>
      </a>
    </div>
    <nav class="header-nav">
      <a href="mercadoHome.html">Painel</a>
      <a href="criar-oferta.html" class="active">Nova Oferta</a>
      <a href="historico.html">Histórico</a>
      <a href="perfil_mercado.html">Perfil</a>
      <button class="btn-sair" onclick="logout()">Sair</button>
    </nav>
  </header>

  <main class="login-container">
    <div class="login-card">
      <h2>Nova oferta</h2>
      <p class="page-subtle" style="margin-top:-4px;margin-bottom:24px;line-height:1.6">
        Preencha as informações da oferta e publique-a para os clientes.
      </p>

      <div class="form-group">
        <label>Nome da oferta *</label>
        <input type="text" id="nome" placeholder="Ex: Arroz 5kg Tipo 1 — Promoção da Semana">
      </div>

      <div class="form-2col">
        <div class="form-group">
          <label>Status</label>
          <!-- CORRIGIDO: "SUSPENSO" → "INATIVO" para bater com o modelo do backend -->
          <select id="status">
            <option value="ATIVO">Ativo</option>
            <option value="INATIVO">Inativo</option>
          </select>
        </div>
        <div class="form-group">
          <label>Data da oferta *</label>
          <input type="date" id="data">
        </div>
      </div>

      <div class="form-group">
        <label>Imagem / encarte</label>
        <div class="upload-area" id="uploadArea">
          <input type="file" accept="image/*" id="imagemInput" onchange="handleUpload(this)">
          <div id="uploadHint" class="upload-hint">
            <div style="font-size:30px;margin-bottom:6px">🖼️</div>
            <div style="font-weight:700">Clique para selecionar</div>
            <div class="small-muted mt-12">PNG ou JPG · até 5MB</div>
          </div>
          <img id="previewImagem" alt="Prévia da imagem">
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btnMercado btn-sm" onclick="limpar()">Limpar</button>
        <button class="btnLoginPage" id="btnCriar" onclick="criarOferta()">Publicar oferta</button>
      </div>
    </div>
  </main>

  <script src="logout.js"></script>
  <script src="criar-oferta.js"></script>
</body>
</html>
