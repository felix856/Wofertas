<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wofertas · Analytics Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/js/modules.js"></script>
    <style>
        .analytics-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .analytics-header {
            margin-bottom: 40px;
        }

        .analytics-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .analytics-header p {
            color: rgba(255,255,255,0.45);
            font-size: 15px;
        }

        /* ─ MÉTRICAS ─ */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: rgba(255,255,255,0.05);
            border: 0.5px solid rgba(255,255,255,0.10);
            border-radius: 14px;
            padding: 22px 24px;
            transition: background 0.2s, transform 0.2s;
        }

        .metric-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        .metric-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .metric-value {
            font-size: 38px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1;
            margin-bottom: 8px;
        }

        .metric-subtext {
            font-size: 12px;
            color: rgba(255,255,255,0.3);
        }

        .metric-badge {
            display: inline-block;
            background: rgba(52,211,153,0.15);
            color: #6ee7b7;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 10px;
        }

        /* ─ INSIGHT BOX ─ */
        .insight-box {
            background: rgba(255,255,255,0.05);
            border: 0.5px solid rgba(255,255,255,0.10);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .insight-box::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, #f97316, #ef4444);
            border-radius: 14px 0 0 14px;
        }

        .insight-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 10px;
        }

        .insight-main {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .insight-text {
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255,255,255,0.55);
        }

        .insight-clients {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 0.5px solid rgba(255,255,255,0.10);
            font-size: 13px;
            color: rgba(255,255,255,0.4);
        }

        .insight-clients strong {
            color: rgba(255,255,255,0.85);
        }

        /* ─ SECTIONS ─ */
        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        /* ─ RANKING CARD ─ */
        .ranking-card {
            background: rgba(255,255,255,0.05);
            border: 0.5px solid rgba(255,255,255,0.10);
            border-radius: 14px;
            overflow: hidden;
        }

        .ranking-header {
            padding: 14px 20px;
            border-bottom: 0.5px solid rgba(255,255,255,0.08);
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.03);
        }

        .ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .ranking-item {
            padding: 14px 20px;
            border-bottom: 0.5px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
        }

        .ranking-item:last-child {
            border-bottom: none;
        }

        .ranking-item:hover {
            background: rgba(255,255,255,0.04);
        }

        .ranking-item-label {
            font-size: 13px;
            color: rgba(255,255,255,0.75);
        }

        .ranking-item-value {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        /* ─ CHART PLACEHOLDER ─ */
        .chart-placeholder {
            background: rgba(255,255,255,0.05);
            border: 0.5px solid rgba(255,255,255,0.10);
            border-radius: 14px;
            padding: 40px;
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
        }
    </style>
<script src="/js/config.js"></script>
</head>
<body>
  <header class="header">
    <div class="logo-container">
      <img src="/imagens/imagemLogo.png" alt="Logo do Wofertas" class="icon-carrinho">
      <a href="/mercadoHome.html">
        <div class="logo"><span class="w">W</span><span class="rest">ofertas</span></div>
      </a>
    </div>
    <nav class="header-nav">
      <a href="/mercadoHome.html">Painel</a>
      <a href="/dashboard-analytics.html" class="active">📊 Analytics</a>
      <a href="/criar-oferta.html">Nova Oferta</a>
      <a href="/historico.html">Histórico</a>
      <a href="/perfil_mercado.html">Perfil</a>
      <button onclick="logout()" class="btn-sair">Sair</button>
    </nav>
  </header>

  <div class="analytics-container">
    <div class="analytics-header">
      <h1>Dashboard Analytics</h1>
      <p>Acompanhamento de performance e dados de suas ofertas</p>
    </div>

    <div class="metrics-grid" id="metricsGrid">
      <div class="metric-card">
        <div class="metric-label">📦 Total de Ofertas</div>
        <div class="metric-value" id="totalOfertas">—</div>
        <div class="metric-subtext">Todas as publicações</div>
      </div>

      <div class="metric-card">
        <div class="metric-label">✅ Ativas</div>
        <div class="metric-value" id="ofertasAtivas">—</div>
        <div class="metric-subtext">Publicadas agora</div>
      </div>

      <div class="metric-card">
        <div class="metric-label">⏳ Inativos</div>
        <div class="metric-value" id="ofertasInativas">—</div>
        <div class="metric-subtext">Pausadas ou expiradas</div>
      </div>

      <div class="metric-card">
        <div class="metric-label">📈 Taxa de Atividade</div>
        <div class="metric-value" id="taxaAtividade">—</div>
        <div class="metric-subtext">Última semana</div>
      </div>
    </div>
  </div>

  <script src="/auth-check.js"></script>
  <script src="/logout.js"></script>
  <script src="/dashboard-analytics.js"></script>
</body>
</html>
