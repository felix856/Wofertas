[versions]
core-ktx                = "1.13.1"
appcompat               = "1.7.0"
material                = "1.12.0"
constraintlayout        = "2.1.4"
activity-ktx            = "1.9.0"
navigation              = "2.7.7"
lifecycle               = "2.8.2"
datastore               = "1.1.1"
fragment                = "1.8.1"
retrofit                = "2.9.0"
okhttp                  = "4.12.0"
coroutines              = "1.8.1"
glide                   = "4.16.0"
osmdroid                = "6.1.18"
play-services-location  = "21.3.0"
threetenabp             = "1.4.9"
junit                   = "4.13.2"
androidx-junit          = "1.2.1"
espresso                = "3.6.1"
ksp                     = "1.9.24-1.0.20"
room                    = "2.6.1"
work                    = "2.9.0"
mlkit-text              = "16.0.1"

[libraries]
core-ktx                   = { module = "androidx.core:core-ktx",                           version.ref = "core-ktx" }
appcompat                  = { module = "androidx.appcompat:appcompat",                     version.ref = "appcompat" }
material                   = { module = "com.google.android.material:material",             version.ref = "material" }
constraintlayout           = { module = "androidx.constraintlayout:constraintlayout",       version.ref = "constraintlayout" }
activity-ktx               = { module = "androidx.activity:activity-ktx",                   version.ref = "activity-ktx" }
fragment-ktx               = { module = "androidx.fragment:fragment-ktx",                   version.ref = "fragment" }
navigation-fragment-ktx    = { module = "androidx.navigation:navigation-fragment-ktx",     version.ref = "navigation" }
navigation-ui-ktx          = { module = "androidx.navigation:navigation-ui-ktx",           version.ref = "navigation" }
lifecycle-viewmodel-ktx    = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx",      version.ref = "lifecycle" }
lifecycle-livedata-ktx     = { module = "androidx.lifecycle:lifecycle-livedata-ktx",       version.ref = "lifecycle" }
datastore-preferences      = { module = "androidx.datastore:datastore-preferences",        version.ref = "datastore" }
retrofit                   = { module = "com.squareup.retrofit2:retrofit",                 version.ref = "retrofit" }
converter-gson             = { module = "com.squareup.retrofit2:converter-gson",           version.ref = "retrofit" }
okhttp                     = { module = "com.squareup.okhttp3:okhttp",                     version.ref = "okhttp" }
logging-interceptor        = { module = "com.squareup.okhttp3:logging-interceptor",        version.ref = "okhttp" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
glide                      = { module = "com.github.bumptech.glide:glide",                 version.ref = "glide" }
osmdroid-android           = { module = "org.osmdroid:osmdroid-android",                   version.ref = "osmdroid" }
play-services-location     = { module = "com.google.android.gms:play-services-location",   version.ref = "play-services-location" }
threetenabp                = { module = "com.jakewharton.threetenabp:threetenabp",         version.ref = "threetenabp" }
junit                      = { module = "junit:junit",                                     version.ref = "junit" }
androidx-junit             = { module = "androidx.test.ext:junit",                         version.ref = "androidx-junit" }
espresso-core              = { module = "androidx.test.espresso:espresso-core",             version.ref = "espresso" }

work-runtime-ktx           = { module = "androidx.work:work-runtime-ktx",                   version.ref = "work" }
mlkit-text-recognition     = { module = "com.google.mlkit:text-recognition",                version.ref = "mlkit-text" }

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }