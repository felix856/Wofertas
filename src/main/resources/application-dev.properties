# ========== DEV PROFILE ==========
spring.application.name=wofertas-dev

# ANTHROPIC (localhost testing)
anthropic.api.key=${ANTHROPIC_API_KEY:test-key-dev}
anthropic.model=${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}

# MONGODB (local/teste - inserir credenciais fake)
spring.data.mongodb.uri=mongodb://localhost:27017/wofertas

# SERVIDOR
server.address=0.0.0.0
    
server.port=8080

# JWT (dev - válido por 24h)
jwt.secret=${JWT_SECRET:ThisIsA256BitSecureKeyForJWTAuthenticationInYourWofertasApp}
jwt.expiration-ms=86400000

# ACTUATOR (tudo aberto em dev)
management.endpoints.web.exposure.include=health,metrics,env
management.health.mail.enabled=false

# MULTIPART
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MAIL (desabilitado em dev - sem servidor SMTP local)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=dev@localhost
spring.mail.password=dev
# Desabilitar envio de emails em dev (não há MailHog/SMTP)
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000

# LOGGING
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always

logging.level.org.springframework.security=DEBUG

# CORS em desenvolvimento: web local, Vercel e backend de nuvem.
app.cors.allowed-origins=http://localhost:5500,http://localhost:5501,http://127.0.0.1:5500,http://127.0.0.1:5501,http://localhost:8080,http://127.0.0.1:8080,https://wofertas.vercel.app,https://wofertas-production.up.railway.app
