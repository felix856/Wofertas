# ========== PROD PROFILE ==========
spring.application.name=wofertas-prod

# ANTHROPIC (env var only)
anthropic.api.key=${ANTHROPIC_API_KEY:vazio}
spring.web.resources.static-locations=file:view/
# MONGODB (env var only)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:wofertas}

# SERVIDOR
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}

# JWT (env var - rotate periodically)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ACTUATOR (apenas health em prod)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# MULTIPART
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MAIL (env var only)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:admin}
spring.mail.password=${MAIL_PASSWORD:admin}

# STATIC RESOURCES - Servir a pasta view como arquivos estáticos
spring.web.resources.static-locations=file:./view/,classpath:/static/,classpath:/public/
spring.web.resources.cache.period=3600

# LOGGING
logging.level.root=WARN
logging.level.com.example.demo=INFO
