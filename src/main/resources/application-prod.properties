# ========== PROD PROFILE ==========
spring.application.name=wofertas-prod

# ANTHROPIC (env var only)
anthropic.api.key=${ANTHROPIC_API_KEY:vazio}
anthropic.model=${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}

# MONGODB (env var only)
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:wofertas}

# SERVIDOR
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}

# JWT (env var - rotate periodically)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ACTUATOR (apenas health em prod)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false

# MULTIPART
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MAIL (env var only)
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@wofertas.com}}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:admin}
spring.mail.password=${MAIL_PASSWORD:admin}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:10000}

# STATIC RESOURCES - Servir a pasta view como arquivos estáticos
spring.web.resources.static-locations=false
spring.web.resources.cache.period=3600

# CORS: defina CORS_ALLOWED_ORIGINS no Railway/Render se mudar o dominio do frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://wofertas.vercel.app,https://backend-s8by1200-felix856s-projects.vercel.app,https://*.vercel.app,https://wofertas-production.up.railway.app}

# LOGGING
logging.level.root=WARN
logging.level.com.example.demo=INFO
